<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giro Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Logo delle app PDE (kit condiviso del PDE Hub): in cima alla barra laterale -->
    <link rel="stylesheet" href="https://albertospde.github.io/pde-hub/assets/pde-app-logo.css">
    <script>
      // Tema chiaro/scuro condiviso con il PDE Hub (stessa chiave): impostato prima del caricamento
      try { if (localStorage.getItem("pde-hub-theme") === "light") document.documentElement.setAttribute("data-theme", "light"); } catch (e) {}
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { color-scheme: dark; }
      body { background: #0d1334; font-family: "DM Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      html[data-theme="light"] { color-scheme: light; }
      html[data-theme="light"] body { background: #f4f7fb; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js"></script>
    <script>window.XLSXStyle = window.XLSX;</script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
